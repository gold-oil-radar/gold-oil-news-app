name: Refresh news

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build news.json
        run: python refresh.py

      - name: Commit and push if changed
        run: |
          git config user.name "gold-oil-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/news.json translations_cache.json
          git diff --cached --quiet || git commit -m "Auto-update news $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
